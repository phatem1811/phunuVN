name: Deploy Static Website

on:
  push:
    branches:
      - main
  # Cho phep bam "Run workflow" tu giao dien Actions
  workflow_dispatch:

# Pages + OIDC de action tu cap quyen deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Cho phep nhieu deploy chay song song, ban thuong moi nhat
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4